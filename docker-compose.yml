services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gluck-bags-web
    image: gluck-bags-web
    environment:
      FLASK_DEBUG: "0"
      # Persistent storage (SQLite DB + uploaded media) on the mounted volume.
      DATA_DIR: /data
      # Admin credentials + session secret. Injected from Infisical/env at deploy
      # time — never hardcode them here.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      VIRTUAL_HOST: gluck.nexttech.com.ar
      VIRTUAL_PORT: 7014
      UMAMI_WEBSITE_ID: 4badbd28-ea2a-4c67-9520-fe0814abcd1d
    ports:
      - "7014:7014"
    expose:
      - "7014"
    restart: unless-stopped
    volumes:
      # DB + uploaded product media survive rebuilds/redeploys here.
      - gluck-data:/data
    networks:
      - proxy
    labels:
      - "com.github.nginx-proxy.nginx_proxy=true"
      - com.github.nginxproxy.nginx-proxy.startup_wait=30

networks:
  proxy:
    external: true

volumes:
  gluck-data:
