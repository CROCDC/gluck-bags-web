services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gluck-bags-web
    image: gluck-bags-web
    environment:
      FLASK_DEBUG: "0"
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_COOKIE_SECURE: "1"
      # Multi-domain: the real apex + www, plus the nexttech alias.
      VIRTUAL_HOST: gluckbags.com,www.gluckbags.com,gluck.nexttech.com.ar
      VIRTUAL_PORT: 7014
      UMAMI_WEBSITE_ID: 4badbd28-ea2a-4c67-9520-fe0814abcd1d
    ports:
      - "7014:7014"
    expose:
      - "7014"
    restart: unless-stopped
    volumes:
      - gluck-data:/data
    networks:
      - proxy
    labels:
      - "com.github.nginx-proxy.nginx_proxy=true"
      - com.github.nginxproxy.nginx-proxy.startup_wait=30

networks:
  proxy:
    external: true

volumes:
  gluck-data:
