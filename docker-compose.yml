# Pin the project name so it never depends on the Jenkins workspace dir.
# Otherwise a workspace renamed to gluck-bags-web2 makes Compose create a new
# project, colliding with the existing container_name and the data volume.
name: gluck-bags-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gluck-bags-web
    image: gluck-bags-web
    environment:
      FLASK_DEBUG: "0"
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_COOKIE_SECURE: "1"
      # The single canonical/indexable origin (OG, canonical, sitemap).
      SITE_URL: https://gluckbags.com
      # Enforce the canonical host: www, the alias and http all 301 to SITE_URL + HSTS.
      FORCE_CANONICAL_HOST: "1"
      # Multi-domain: the real apex + www, plus the nexttech alias. The alias and www
      # are routed here so the app can 301 them to the canonical host.
      VIRTUAL_HOST: gluckbags.com,www.gluckbags.com,gluck.nexttech.com.ar
      VIRTUAL_PORT: 7014
      UMAMI_WEBSITE_ID: 4badbd28-ea2a-4c67-9520-fe0814abcd1d
      # Tienda Nube headless POC. Values come from Infisical (prod) via `infisical run`.
      # CATALOG_SOURCE stays "admin" (current site) until go-live; flip the Infisical
      # value to "tiendanube" to serve the storefront from the TN mirror. The TN_* vars
      # are read by the checkout handoff, the webhook HMAC check and the hourly sync.
      CATALOG_SOURCE: ${CATALOG_SOURCE:-admin}
      TN_STORE_ID: ${TN_STORE_ID:-}
      TN_ACCESS_TOKEN: ${TN_ACCESS_TOKEN:-}
      TN_CLIENT_ID: ${TN_CLIENT_ID:-}
      TN_CLIENT_SECRET: ${TN_CLIENT_SECRET:-}
    ports:
      - "7014:7014"
    expose:
      - "7014"
    restart: unless-stopped
    volumes:
      - gluck-data:/data
    networks:
      - proxy
    labels:
      - "com.github.nginx-proxy.nginx_proxy=true"
      - com.github.nginxproxy.nginx-proxy.startup_wait=30

networks:
  proxy:
    external: true

volumes:
  gluck-data:
