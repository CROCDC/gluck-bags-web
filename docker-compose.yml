services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gluck-bags-web
    image: gluck-bags-web
    environment:
      FLASK_DEBUG: "0"
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-uploads}
      VIRTUAL_HOST: gluck-bags.com,www.gluck-bags.com,gluck.nexttech.com.ar
      VIRTUAL_PORT: 7014
      UMAMI_WEBSITE_ID: 4badbd28-ea2a-4c67-9520-fe0814abcd1d
    ports:
      - "7014:7014"
    expose:
      - "7014"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "com.github.nginx-proxy.nginx_proxy=true"
      - com.github.nginxproxy.nginx-proxy.startup_wait=30

  promtail:
    build:
      context: .
      dockerfile: Dockerfile.promtail
    image: gluck-bags-web-promtail
    container_name: gluck-bags-web-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      # docker.sock is a real host path, so this bind-mount works under Jenkins.
      # The config is baked into the image (Dockerfile.promtail) instead of
      # bind-mounted, because the Jenkins workspace isn't visible to the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy

networks:
  proxy:
    external: true
