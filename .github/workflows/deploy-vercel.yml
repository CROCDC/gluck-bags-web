# Deploy to Vercel on every push to main.
#
# This replaces the Jenkins trigger that deployed to the Raspberry Pi. The Pi is left
# running as a rollback: reverting means pointing the Cloudflare DNS records for
# gluckbags.com back at the tunnel and re-running the Jenkins job by hand.
#
# The job is INERT until VERCEL_TOKEN exists, on purpose. There are two ways to get
# automatic deploys and only one should be active:
#
#   1. Install the Vercel GitHub App on this repository and connect it to the project
#      (Vercel dashboard -> Project -> Settings -> Git). Vercel then deploys by itself
#      and this workflow should be deleted, or it will deploy the same commit twice.
#   2. Create a token (Vercel -> Account Settings -> Tokens) and add it here as the
#      VERCEL_TOKEN secret. Nothing else is needed; the org and project ids are already
#      set as secrets.
#
# Until one of those happens, deploys are manual: `vercel deploy --prod`.
name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deploys are wired up
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN no está configurado; el deploy no corre. Ver el encabezado de este workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Deploy
        if: steps.check.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          # The bundle ships a static ffmpeg build and the image codecs, which puts it
          # over the standard function size limit. See docs/DEPLOY-VERCEL.md.
          export VERCEL_SUPPORT_LARGE_FUNCTIONS=1
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
